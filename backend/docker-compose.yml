# Bază locală PostgreSQL + PostGIS pentru dezvoltare:
#   docker compose -f backend/docker-compose.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mwitness
      POSTGRES_PASSWORD: mwitness
      POSTGRES_DB: mwitness
    ports:
      - "5432:5432"
    volumes:
      - mwitness_db:/var/lib/postgresql/data
volumes:
  mwitness_db:
